server:
  port: 8080

spring:
  application:
    name: airport-taxi-backend
  datasource:
    url: jdbc:mysql://localhost:3306/airport_taxi?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

app:
  data:
    base-dir: ../hackathon-problem-2-airport-taxi-offers/data
